name: Build Pull request
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    runs-on: ubuntu-latest
    name: Build (Node 24 LTS)
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test:mdx
      # Paikallinen sisältö: ei vaadi Tina Cloud -tunnuksia. Tina Cloud -build tarkistetaan Vercelin preview-deployssa.
      - run: yarn build:local
