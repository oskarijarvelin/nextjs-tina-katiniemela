fragment PageParts on Page {
  title
  description
  blocks {
    __typename
    ... on PageBlocksHero {
      otsikko
      sisalto
      bgImg
      kuvateksti
      hero_linkit {
        __typename
        url
        title
      }
    }
    ... on PageBlocksKuva {
      img
      kuva_kuvateksti
    }
    ... on PageBlocksPalsta {
      ankkuri
      palsta_kuva
      palsta_kuvateksti
      palsta_reverse
      palsta_otsikko
      palsta_sisalto
      palsta_linkit {
        __typename
        url
        title
      }
    }
    ... on PageBlocksKokemus {
      kokemus_otsikko
      kokemus_sisalto
      kokemus_lista {
        __typename
        title
        ajankohta
        kuvaus
      }
    }
    ... on PageBlocksJulkaisut {
      ankkuri
      julkaisut_otsikko
      julkaisut_sisalto
      julkaisut_lista {
        __typename
        kuva
        title
        tyyppi
        ajankohta
        spotify
        youtube
        kuvaus
        kappaleet {
          __typename
          title
          meta
        }
      }
    }
    ... on PageBlocksVideot {
      ankkuri
      videot_nakyvissa
      videot_otsikko
      videot_sisalto
      videot_lista {
        __typename
        title
        ajankohta
        url
      }
    }
    ... on PageBlocksNosto {
      ankkuri
      nosto_pieni_otsikko
      nosto_otsikko
      nosto_sisalto
      nosto_kuva
      nosto_kuvateksti
      nosto_reverse
      nosto_painikkeet {
        __typename
        url
        title
      }
    }
    ... on PageBlocksLomake {
      ankkuri
      lomake_tyyppi
      lomake_otsikko
      lomake_sisalto
      lomake_kiitos
    }
    ... on PageBlocksYhteystiedot {
      yhteystiedot_otsikko
    }
    ... on PageBlocksKeikat {
      ankkuri
      keikat_otsikko
      keikat_tyhja
      keikat_cta_teksti
      keikat_cta_url
      keikat_menneet_otsikko
      keikat_lista {
        __typename
        pvm
        tapahtuma
        lisatieto
        linkki
      }
    }
    ... on PageBlocksUkk {
      ankkuri
      ukk_otsikko
      ukk_sisalto
      ukk_lista {
        __typename
        kysymys
        vastaus
      }
    }
  }
}

fragment SettingsParts on Settings {
  title
  sivuston_nimi
  sahkoposti
  facebook_url
  instagram_url
  linkedin_url
  yritys
  mainnav {
    __typename
    nav {
      __typename
      url
      title
    }
  }
}
